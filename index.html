<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Studio</title>
<style>
  :root { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #1e293b; }
  body { margin: 0; background: linear-gradient(#dbeafe, #ecfdf5 45%, #fffbeb); min-height: 100vh; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 64px 16px; }
  h1 { color: #065f46; letter-spacing: -0.02em; font-size: 2.2rem; }
  p.sub { color: #475569; }
  .app { display: block; margin-top: 24px; padding: 20px 24px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.07); text-decoration: none; color: inherit; transition: transform .15s, box-shadow .15s; }
  .app:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.12); }
  .app .icon { font-size: 2rem; }
  .app h2 { margin: 8px 0 4px; font-size: 1.15rem; color: #047857; }
  .app p { margin: 0; color: #475569; font-size: .92rem; line-height: 1.6; }
  footer { margin-top: 48px; text-align: center; font-size: .75rem; color: #94a3b8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎨 Studio</h1>
  <p class="sub">Meine Sammlung kleiner Web-Anwendungen – jede App lebt in ihrem eigenen Ordner.</p>
  <a class="app" href="apps/world-generator/">
    <span class="icon">🌍</span>
    <h2>Prozeduraler Weltengenerator</h2>
    <p>Erstelle ganze Landschaften aus einer einzigen Zahl und ein paar Regeln – mit 2D-Karte und drehbarer 3D-Welt. Für Entdecker ab 8 Jahren.</p>
  </a>
  <footer>Mehr Apps folgen …</footer>
</div>
</body>
</html>
